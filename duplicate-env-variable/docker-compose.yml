services:
  # 1. The same variable repeated within the list form of `environment`.
  #    The map form would be invalid YAML (duplicate key); the list form is
  #    accepted and the last entry wins.
  duplicate-in-list:
    image: busybox:1.36
    command: ["sh", "-c", "env | grep -E 'GREETING|LOG_LEVEL' && sleep 3600"]
    environment:
      - GREETING=first
      - LOG_LEVEL=debug
      - GREETING=second
      - LOG_LEVEL=warn

  # 2. The same variable defined in both `env_file` and `environment`.
  #    `environment` takes precedence over `env_file`.
  duplicate-across-env-file:
    image: busybox:1.36
    command: ["sh", "-c", "env | grep -E 'LOG_LEVEL|REGION' && sleep 3600"]
    env_file:
      - .env.app
    environment:
      LOG_LEVEL: "debug"
      REGION: "eu-west-1"
