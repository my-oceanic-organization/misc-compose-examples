services:
  my_service:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "demo"
      POSTGRES_USER: "demo"
      POSTGRES_PASSWORD: "demo"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  my-service:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app_underscore:
    image: adminer:5
    depends_on:
      my_service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: my_service

  app-hyphen:
    image: rediscommander/redis-commander:latest
    depends_on:
      my-service:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: "local:my-service:6379"

  app_both:
    image: grafana/grafana:11
    depends_on:
      my_service:
        condition: service_healthy
      my-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_DATABASE_TYPE: "postgres"
      GF_DATABASE_HOST: "my_service:5432"
      GF_DATABASE_NAME: "demo"
      GF_DATABASE_USER: "demo"
      GF_DATABASE_PASSWORD: "demo"
      GF_DATABASE_SSL_MODE: "disable"
      GF_REMOTE_CACHE_TYPE: "redis"
      GF_REMOTE_CACHE_CONNSTR: "network=tcp,addr=my-service:6379,pool_size=100,db=0,ssl=false"
